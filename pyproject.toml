[project]
name = "vectorless-vs-vectordb-rag"
version = "0.1.0"
description = "Comparing vectorless RAG (PageIndex) with vector-DB RAG"
readme = "README.md"
authors = [
    { name = "Arpan Kumar Panda", email = "arpankumarpandaar7@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "chromadb>=1.5.9",
    "langgraph>=1.2.20",
    "matplotlib>=3.11.2",
    "openai>=2.54.0",
    "pageindex[claude]>=0.5.3",
    "pandas>=3.1.1",
    "pypdf>=7.0.1",
    "python-dotenv>=1.2.4",
    "streamlit>=1.67.0",
]

[project.scripts]
vectorless-vs-vectordb-rag = "vectorless_vs_vectordb_rag:main"

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
    "jupyter>=1.1.1",
]
